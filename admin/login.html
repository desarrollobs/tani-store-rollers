
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrativo | Tani Store Rollers</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f8;
      color: #242438;
    }

    .login {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 40px #20204012;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: #7b4bd4;
      text-align: center;
    }

    h1 {
      font-size: 23px;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #707080;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dddde8;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #7b4bd4;
      color: white;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #mensaje {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    a { color: #7041c5; }
  </style>
</head>
<body>
  <main class="login">
    <div class="logo">TANI STORE ROLLERS</div>
    <h1>Panel de administración</h1>
    <p class="subtitle">Ingresá con tu cuenta autorizada.</p>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email"
        autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="submitBtn" type="submit">
        Iniciar sesión
      </button>

      <p id="mensaje" role="status" aria-live="polite"></p>
    </form>

    <p style="text-align:center;margin-top:24px">
      <a href="../index.html">Volver al catálogo</a>
    </p>
  </main>

  <script type="module">
    import { supabase } from '../js/supabase.js';

    const form = document.querySelector('#loginForm');
    const mensaje = document.querySelector('#mensaje');
    const boton = document.querySelector('#submitBtn');

    const ADMIN_EMAIL = 'taniak_arina@hotmail.com';

    async function comprobarSesion() {
      const { data } = await supabase.auth.getSession();
      const user = data.session?.user;

      if (user?.email?.toLowerCase() === ADMIN_EMAIL) {
        location.replace('./index.html');
      }
    }

    comprobarSesion();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      boton.disabled = true;
      mensaje.textContent = 'Verificando acceso...';

      const email = document.querySelector('#email')
        .value.trim().toLowerCase();
      const password = document.querySelector('#password').value;

      try {
        if (email !== ADMIN_EMAIL) {
          throw new Error('Esta cuenta no está autorizada.');
        }

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        if (data.user?.email?.toLowerCase() !== ADMIN_EMAIL) {
          await supabase.auth.signOut();
          throw new Error('Cuenta no autorizada.');
        }

        location.replace('./index.html');
      } catch (error) {
        mensaje.textContent =
          error.message || 'No se pudo iniciar sesión.';
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
